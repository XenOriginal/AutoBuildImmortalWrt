name: Validate kernel config (FAST)

# ============================================================================
# 内核配置快速验证 —— 验证"路径 A"的三步方案是否有效
#
# 背景:
#   完整源码编译每轮 30-50 分钟, 而失败总在内核 syncconfig。
#   本工作流用【同样的三步流程】做验证, 4-8 分钟出结果:
#     1. make target/linux/prepare
#     2. cd 内核目录 && yes '' | make ARCH=x86 oldconfig
#     3. make ARCH=x86 syncconfig </dev/null   ← 能通过则完整编译也能通过
#
#   若第 3 步通过, 说明内核配置已定型, 完整编译不会再卡在 syncconfig。
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      imm_branch:
        description: "ImmortalWrt 源码分支"
        required: true
        default: "openwrt-25.12"
        type: choice
        options:
          - openwrt-25.12
          - openwrt-24.10

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc g++ make perl python3 rsync unzip wget git \
            file bzip2 gzip tar patch cpio bc genisoimage libncurses-dev \
            libssl-dev zlib1g-dev gettext libelf-dev subversion swig time \
            xsltproc gawk python3-distutils python3-setuptools

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 -b "${{ inputs.imm_branch }}" \
            https://github.com/immortalwrt/immortalwrt.git /tmp/imm
          echo "克隆完成: $(du -sh /tmp/imm | cut -f1)"

      - name: Inject QAT packages
        run: |
          mkdir -p /tmp/imm/package/qat
          cp -r qat-src/qat-kmod     /tmp/imm/package/qat/
          cp -r qat-src/qat-firmware /tmp/imm/package/qat/
          find /tmp/imm/package/qat -type f | sort

      - name: Generate config
        run: |
          cd /tmp/imm
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_SUBTARGET="64"
          CONFIG_TARGET_PROFILE="generic"
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_x86_64_DEVICE_generic=y
          EOF
          make defconfig >/dev/null 2>&1

          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-crypto-qat-common=m
          CONFIG_PACKAGE_kmod-crypto-qat-dh895xcc=m
          CONFIG_PACKAGE_qat-firmware-dh895xcc=m
          EOF
          make defconfig >/dev/null 2>&1

          # 注入会触发的依赖型符号
          for cfg in target/linux/x86/config-6.12 target/linux/generic/config-6.12; do
            [ -f "$cfg" ] || continue
            grep -q "^CONFIG_CRYPTO_DH_RFC7919_GROUPS=" "$cfg" || \
              echo "CONFIG_CRYPTO_DH_RFC7919_GROUPS=y" >> "$cfg"
            grep -q "^CONFIG_CRYPTO_DEV_QAT_ERROR_INJECTION=" "$cfg" || \
              echo "CONFIG_CRYPTO_DEV_QAT_ERROR_INJECTION=n" >> "$cfg"
          done

          echo "=== QAT 包 ==="
          grep -E "CONFIG_PACKAGE_.*qat" .config || { echo "QAT 未选中"; exit 1; }

      # =====================================================================
      # 核心: 复现脚本的三步流程
      # =====================================================================
      - name: "Step 1/3: make target/linux/prepare"
        run: |
          cd /tmp/imm
          make target/linux/prepare V=s 2>&1 | tail -25

      - name: "Step 2/3: yes '' | make oldconfig"
        run: |
          cd /tmp/imm
          KDIR=$(find build_dir/target-x86_64_musl/linux-x86_64 -maxdepth 2 -type d -name "linux-6.*" 2>/dev/null | head -1)
          if [ -z "$KDIR" ]; then
            echo "::error::未找到目标内核目录"
            find build_dir -maxdepth 4 -type d -name "linux-*" | head
            exit 1
          fi
          echo "内核目录: $KDIR"
          # 校验确实是内核源码树 (含顶层 Makefile)
          if [ ! -f "$KDIR/Makefile" ]; then
            echo "::error::目录不是内核源码树 (无 Makefile): $KDIR"
            ls -la "$KDIR" | head
            exit 1
          fi
          cd "$KDIR"
          yes '' | make ARCH=x86 oldconfig 2>&1 | tail -25

      - name: "Step 3/3: verify syncconfig non-interactive"
        run: |
          cd /tmp/imm
          KDIR=$(find build_dir/target-x86_64_musl/linux-x86_64 -maxdepth 2 -type d -name "linux-6.*" 2>/dev/null | head -1)
          cd "$KDIR"

          echo "=== 尝试非交互 syncconfig ==="
          if make ARCH=x86 syncconfig </dev/null >/tmp/sync.log 2>&1; then
            echo "✅✅✅ syncconfig 通过 —— 完整编译不会再卡在内核配置"
            echo
            echo "=== 确认 QAT 内核符号已定型 ==="
            grep -E "CONFIG_CRYPTO_DEV_QAT" .config || echo "(未找到)"
          else
            echo "❌ syncconfig 失败, 残留符号:"
            grep -E "\(NEW\)|Error" /tmp/sync.log | head -20
            echo "::error::内核配置仍有残留 NEW 符号, 完整编译必定失败"
            exit 1
          fi
