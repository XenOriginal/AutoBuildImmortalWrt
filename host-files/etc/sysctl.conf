# ============================================================================
# ImmortalWrt host tuning — Inspur AliMoC-MD-02-25G
#
# This file is intentionally conservative about dirty-page limits:
# the host has no UPS and has already suffered a power-loss/ext4 incident.
# We keep absolute dirty limits small (32/64 MiB) instead of kernel ratios.
# Network values are tuned for the PPPoE / 10-25G / Docker host workload.
# ============================================================================

# ---- TCP / BBR ----
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq_codel
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_mtu_probing=1
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_tw_reuse=1
net.core.netdev_max_backlog=16384
net.core.somaxconn=8192
net.ipv4.tcp_max_syn_backlog=8192
net.ipv4.tcp_notsent_lowat=131072

# ---- dirty page / power-loss hardening ----
vm.dirty_background_bytes=33554432
vm.dirty_bytes=67108864
vm.dirty_expire_centisecs=500
vm.dirty_writeback_centisecs=200
vm.swappiness=10
vm.max_map_count=262144

# ---- hung task observability (kernel feature 55-lockup-detect) ----
kernel.hung_task_timeout_secs=120
kernel.hung_task_warnings=10
