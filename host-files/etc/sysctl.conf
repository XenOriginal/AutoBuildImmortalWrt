# ============================================================================
# 宿主机专属内核调优  ——  Inspur AliMoC-MD-02-25G
# 由宿主机实际运行配置固化而来, 2026-09-17
#
# 注意: 本文件是 /etc/sysctl.conf, 在 /lib/upgrade/keep.d/base-files-essential
#       的保留清单中, 可安全跨 sysupgrade 升级。
#       (而 /etc/sysctl.d/* 不被备份, 重新刷写会丢失, 故不使用该目录)
# ============================================================================

# ---- TCP 传输层调优, 针对高 RTT 国际链路 (原日期 2026-09-12) ----
# BBR 拥塞控制; 内核模块由 /etc/modules.d/30-tcp-bbr 开机加载
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq_codel
# 空闲后不重置拥塞窗口: 高 RTT 下避免每次突发重新慢启动
net.ipv4.tcp_slow_start_after_idle=0
# 开启 PMTU 黑洞探测 (PPPoE 1492 / IPv6 场景)
net.ipv4.tcp_mtu_probing=1
# 放大 socket 缓冲上限 (默认仅 208KB)
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
# TCP Fast Open: 客户端 + 服务端
net.ipv4.tcp_fastopen=3

# ---- 脏页回写与 zram (原日期 2026-09-16) ----
# 背景: U盘 nr_requests=1/write-through/no-scheduler, 小文件回写仅约 0.44MB/s。
#       内核默认按内存比例允许 355MB 触发回写 / 711MB 才限流,
#       会堆积成堰塞湖导致整机 D 状态挂死。
#       此处把积压上限压到 32MB/64MB, 并让回写线程更勤快。
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 67108864
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 200

# 有 zram 后: 优先换出匿名页到压缩内存, 避免为回收文件页而触发慢速回写
vm.swappiness = 150
