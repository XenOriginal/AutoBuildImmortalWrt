# ============================================================================
# UEFI / Legacy 双启动兼容
#
# 【现状与目标】
#   - 当前这台机器是 Legacy (BIOS) 启动: 无 /sys/firmware/efi。
#   - 目标: 两种启动方式都能用, 后续优先 UEFI。
#
# 【为什么基本不用改内核配置】
#   ImmortalWrt x86/64 的 target 本来就同时产出两种合盘镜像:
#       immortalwrt-x86-64-generic-ext4-combined.img.gz       ← Legacy/BIOS
#       immortalwrt-x86-64-generic-ext4-combined-efi.img.gz   ← UEFI
#   且二者共用同一份 GRUB 生成逻辑 (target/linux/x86/image/Makefile 的
#   Build/grub-config): 串口、console 命令行(CONFIG_GRUB_BOOTOPTS)、
#   超时、标题对两种启动方式一致 → 现有的 ttyS4 串口控制台在 UEFI 下同样生效。
#   分区层面 CONFIG_EFI_PARTITION=y 已内建 (GPT/ESP 支持)。
#
# 【本片段补的是"用户态工具 + 模块"】
#   - efibootmgr:  UEFI 下查看/调整启动顺序 (实现"优先 UEFI 启动"的操作工具)
#   - kmod-fs-efivarfs: 提供 efivarfs, 没有它 efibootmgr 无法读写 NVRAM
#     (官方基线是 CONFIG_EFIVAR_FS=m, 故必须按"包"选, 不能强写 =y)
#
# 【Legacy → UEFI 切换路径 (刷机时)】
#   1. BIOS 里把 CSM/Legacy 关掉 (纯 UEFI 模式);
#   2. 写入 *-combined-efi.img.gz 这份镜像 (sysupgrade 保留配置, 但
#      Legacy→UEFI 属于换启动方式, 建议先备份 /etc/config 再整盘写);
#   3. 起来后 efibootmgr -v 查看启动项, efibootmgr -o 调整顺序。
#   两份镜像都随每次构建产出, 随时可以切回来 (用 combined.img.gz 重写)。
#
# 【刷机后核验】
#   ls /sys/firmware/efi            # UEFI 启动时存在
#   efibootmgr -v                   # 能列出启动项
#   cat /proc/cmdline               # 含 console=ttyS4,57600n8 (串口在 UEFI 下同样生效)
# ============================================================================

[meta]
desc=UEFI/Legacy 双启动兼容 (efibootmgr + efivarfs)
expect_pkgs=efibootmgr,kmod-fs-efivarfs

[config]
CONFIG_PACKAGE_efibootmgr=y
CONFIG_PACKAGE_kmod-fs-efivarfs=y
