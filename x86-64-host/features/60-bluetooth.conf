# ============================================================================
# 蓝牙栈: BT 内核模块 + BlueZ 用户态
#
# 【背景】
#   宿主换了 USB 蓝牙 dongle (CSR8510 A10, 0a12:0001, 挂 GenesysLogic Hub 的 1-4.2)。
#   原固件内核 CONFIG_BT=n(无蓝牙子系统), 且无 BlueZ 用户态 → dongle 只能被通用
#   usb 驱动占据, 永远出不了 hci0。
#
# 【为什么用"包"而不是强写内核 CONFIG_BT=y】
#   kmod-bluetooth / kmod-btusb 的 KernelPackage 会通过 KCONFIG 让内核把 CONFIG_BT
#   拉成 =m, 并自动带上 BREDR/LE/HCI 等依赖符号 —— 与 20-crypto-accel 同理, 只选包、
#   不强改内核符号, 避免 .ko 不再生成导致 kmod 包失败的 QAT 式事故。
#
# 【刷机后核验】
#   zcat /proc/config.gz | grep '^CONFIG_BT='      # 期望 =m
#   lsmod | grep -E 'bluetooth|btusb'
#   hciconfig -a 2>/dev/null || bluetoothctl list  # CSR8510 上电后应出现 hci0
# ============================================================================

[meta]
desc=蓝牙栈 (BT 内核模块 + BlueZ 用户态)
expect_pkgs=kmod-bluetooth,kmod-btusb,bluez-daemon,bluez-utils

[config]
CONFIG_PACKAGE_kmod-bluetooth=y
CONFIG_PACKAGE_kmod-btusb=y
CONFIG_PACKAGE_bluez-libs=y
CONFIG_PACKAGE_bluez-daemon=y
CONFIG_PACKAGE_bluez-utils=y
CONFIG_PACKAGE_bluez-tools=y
