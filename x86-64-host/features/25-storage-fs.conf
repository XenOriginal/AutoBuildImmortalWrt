# ============================================================================
# 可移动存储 / 文件系统支持 (U 盘: exFAT / NTFS / FAT32 等)
#
# 【为什么需要单独一项】这台机器是网关 + 容器宿主, 插 U 盘/移动硬盘取数据是
#   常见需求。默认基线虽然内建了 vfat/exfat/ntfs3 的内核模块, 但有两个真实缺口:
#
#   缺口 1: **FAT 默认字符集是 iso8859-1** —— 中文/日文文件名会乱码。
#     实测官方基线: CONFIG_FAT_DEFAULT_IOCHARSET="iso8859-1",
#                   CONFIG_NLS_DEFAULT="iso8859-1"
#     而内核其实已经带了 nls_utf8.ko / nls_cp936.ko 等模块(实测 /lib/modules 内存在),
#     所以这不是能力问题, 只是**默认值**问题。
#     本片段把默认字符集改成 utf8: 之后任何 `mount /dev/sdX /mnt`(不带 -o)都能
#     正确显示中文名, 不需要每处手写 iocharset=utf8。
#     (exFAT 内部就是 UTF-16/UTF-8, ntfs3 默认 UTF-8, 二者无需额外设置)
#
#   缺口 3(来自 2026-10-14 掉电事故): **检修工具不全** —— 本机频繁硬断电,
#     分区一旦损坏需要【就地 fsck】而不是等人到场。其中 fsck.f2fs 尤其关键:
#     根文件系统的 overlay 就是 f2fs(位于 sdb2), 但固件里此前只有 mkfs.f2fs,
#     没有 fsck.f2fs(f2fsck 包)。
#
#   缺口 2: **用户态工具不全** —— 能挂载不等于能格式化/修复:
#     - exFAT: 现固件已有 mkfs.exfat/fsck.exfat, 但包要显式确保
#     - NTFS : 现固件只有内核 ntfs3(读写可用), 缺 mkntfs/ntfsfix/ntfs-3g(FUSE 兜底)
#     - FAT  : dosfstools 已有
#   补上这些, 才能在路由器上直接"格式化/修复"一块 U 盘。
#
# 【TRIM】同时带上 fstrim: 迁移到 SSD 后需要周期 TRIM 维持写入性能与寿命
#   (现固件的 f2fs overlay 是 nodiscard 挂载, 只能靠周期 fstrim)。
#
# 【刷机后核验】
#   # FAT 字符集
#   mkfs.fat -n TEST /tmp/t.img 2>/dev/null; mkdir -p /mnt/t; mount -o loop /tmp/t.img /mnt/t
#   touch "/mnt/t/中文测试.txt"; ls /mnt/t           # 应正确显示, 不是乱码
#   # exFAT / NTFS
#   mkfs.exfat /tmp/e.img && fsck.exfat /tmp/e.img  # 工具可用
#   mkntfs -f /tmp/n.img && ntfsfix -n /tmp/n.img   # NTFS 工具可用
#   # TRIM
#   fstrim -v /overlay /Lager                        # 需要根权限与 SSD
# ============================================================================

[meta]
desc=可移动存储: exFAT/NTFS/FAT32 工具 + UTF-8 文件名默认 + fstrim
expect_pkgs=kmod-fs-exfat,kmod-fs-ntfs3,kmod-nls-utf8,exfat-mkfs,exfat-fsck,ntfs-3g,fstrim,e2fsprogs,dosfstools,f2fsck

[config]
# --- 内核模块 (默认字符集由下方 kconfig 决定) ---
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-fs-msdos=y
CONFIG_PACKAGE_kmod-fs-exfat=y
CONFIG_PACKAGE_kmod-fs-ntfs3=y
# --- 字符集 (UTF-8 必需; 437/iso8859-1 兼容旧盘; cp936 兼容 GBK 老盘) ---
CONFIG_PACKAGE_kmod-nls-utf8=y
CONFIG_PACKAGE_kmod-nls-cp437=y
CONFIG_PACKAGE_kmod-nls-iso8859-1=y
CONFIG_PACKAGE_kmod-nls-cp936=y
# --- 用户态工具: 格式化 / 修复 / TRIM ---
CONFIG_PACKAGE_exfat-mkfs=y
CONFIG_PACKAGE_exfat-fsck=y
CONFIG_PACKAGE_ntfs-3g=y
CONFIG_PACKAGE_ntfs-3g-utils=y
CONFIG_PACKAGE_dosfstools=y
CONFIG_PACKAGE_fstrim=y
# 自愈脚本依赖: 分区损坏时无人到场, 必须能就地 fsck
CONFIG_PACKAGE_e2fsprogs=y
CONFIG_PACKAGE_f2fsck=y

[kconfig]
# FAT 挂载默认字符集改为 utf8 (否则中文文件名乱码)
CONFIG_FAT_DEFAULT_IOCHARSET="utf8"
CONFIG_NLS_DEFAULT="utf8"
