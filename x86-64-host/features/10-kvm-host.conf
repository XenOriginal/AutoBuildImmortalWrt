# ============================================================================
# KVM / QEMU 宿主能力 —— 让这台软路由能跑硬件虚拟机
#
# 【实测依据】(2026-10-11, 宿主机 ImmortalWrt 25.12 / kernel 6.12.74)
#   - CPU: Intel Atom C3958 (Denverton), 16 线程全部带 vmx; EPT/VPID/
#     unrestricted_guest/APICv 均支持; 机器本身不是虚拟机 (无 hypervisor 标志)。
#   - 官方固件里没有任何 KVM 模块: lsmod 无 kvm / /dev/kvm 不存在。
#   - 手工 apk add kmod-kvm-x86 kmod-kvm-intel kmod-vhost-net 后:
#       /dev/kvm 出现 (10,232), kvm_intel 参数 ept=Y nested=Y;
#       qemu-system-x86_64 -accel kvm -cpu host 成功跑完 SeaBIOS 引导
#       (-cpu host 仅 KVM 可用, 排除 TCG 软件模拟)。
#   - 因此本片段只是把【已实测可用】的能力固化进固件, 刷机/重启后不再丢失。
#
# 【包体量】约 4 MB (kmod 0.5 MB + QEMU 3.1 MB), 对 1 GB rootfs 无压力。
#
# 【刷机后核验】
#   ls -l /dev/kvm                      # 应存在
#   lsmod | grep -E 'kvm|vhost'         # kvm / kvm_intel / vhost_net
#   qemu-system-x86_64 -accel kvm -cpu host -m 1024 -nographic -no-reboot
#   ethtool -k eth0 | grep hw-tc        # (与本特性无关, 见 FEATURES.md 卸载章节)
# ============================================================================

[meta]
desc=KVM/QEMU 硬件虚拟机宿主能力
expect_pkgs=kmod-kvm-x86,kmod-kvm-intel,kmod-vhost-net,qemu-x86_64-softmmu,qemu-img

[config]
CONFIG_PACKAGE_kmod-kvm-x86=y
CONFIG_PACKAGE_kmod-kvm-intel=y
CONFIG_PACKAGE_kmod-vhost=y
CONFIG_PACKAGE_kmod-vhost-net=y
CONFIG_PACKAGE_kmod-vfio=y
CONFIG_PACKAGE_kmod-vfio-pci=y
CONFIG_PACKAGE_qemu-x86_64-softmmu=y
CONFIG_PACKAGE_qemu-img=y
CONFIG_PACKAGE_qemu-firmware-seabios=y
CONFIG_PACKAGE_qemu-firmware-efi=y
CONFIG_PACKAGE_qemu-bridge-helper=y
