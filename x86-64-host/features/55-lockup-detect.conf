# ============================================================================
# 内核挂死/软锁检测 (hung task / soft lockup)
#
# 【背景】2026-10-18 的关机卡死复盘发现: 本机原厂内核
#   # CONFIG_DETECT_HUNG_TASK is not set
#   # CONFIG_SOFTLOCKUP_DETECTOR is not set
# 于是 D 状态进程卡住时内核一声不响, 只能拔电。这里补上能力:
#   - 120s 未完成的任务写内核日志 (不 panic, 避免瞬时 IO 抖动重启)
#   - soft lockup 检测默认开启, 不 panic
# 与 hw-watchdog 分工: 本项负责"记录是谁卡住", 看门狗负责"最后重启"。
#
# 刷机后核验:
#   cat /proc/sys/kernel/hung_task_timeout_secs    # 120
#   dmesg | grep -i 'hung_task\|soft lockup'
# ============================================================================

[meta]
desc=内核 hung_task / softlockup 可观测性

[kconfig]
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120
CONFIG_BOOTPARAM_HUNG_TASK_PANIC=n
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=n
