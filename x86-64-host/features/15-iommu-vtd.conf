# ============================================================================
# VT-d / IOMMU 直通能力预留 (Intel IOMMU + VFIO)
#
# 【为什么需要"预留"这一句】
#   实测这台机器当前的状态是"硬件有、软件不肯用":
#     - BIOS: ACPI DMAR 表存在 → VT-d 硬件在 (BIOS 里的开关随后会打开);
#     - 内核: CONFIG_INTEL_IOMMU=y / CONFIG_IRQ_REMAP=y 已内建,
#             但 CONFIG_INTEL_IOMMU_DEFAULT_ON **未开** →
#             无 intel_iommu=on 时 IOMMU 不激活:
#             /sys/kernel/iommu_groups 为 0, /sys/class/iommu 为空;
#     - 更关键: CONFIG_VFIO **完全没编**, 固件里也没有 vfio/vfio-pci 模块
#       → 即使 IOMMU 开了也无法把设备交给虚拟机。
#   本片段补齐软件侧, 使"BIOS 打开 VT-d 后立刻可用", 不需要再重编固件。
#
# 【内核命令行】另一处配套改动在 build-source.sh §4.2:
#   CONFIG_GRUB_BOOTOPTS 增加 `intel_iommu=on iommu=pt`
#   - on: 明确启用 DMA 重映射 (与 DEFAULT_ON 双保险, 两者任一即可)
#   - pt: passthrough 模式, 未绑定到 VM 的设备直接透传地址, 避免全机 DMA
#         翻译带来的性能损失 —— 宿主为容器/路由用途, 必须加这一项
#   注: BIOS 未开 VT-d 时, 上述参数无副作用 (无 DMAR 表则不激活)。
#
# 【VFIO 为什么用包而不是强写 =y】
#   kmod-vfio / kmod-vfio-pci 声明的 KCONFIG 是 =m; 在 target config 里强写
#   CONFIG_VFIO=y 会让 .ko 不再生成, 对应 kmod 包报 "missing .ko"
#   (即 QAT SDK 那次失败模式)。故此处只选包。
#
# 【刷机 + BIOS 打开 VT-d 后核验】
#   ls /sys/kernel/iommu_groups/            # 应出现多个组
#   ls /sys/class/iommu/                    # 应出现 dmar0
#   dmesg | grep -i -E 'DMAR: IOMMU enabled|Intel\(R\) Virtualization'
#   ls /sys/bus/pci/drivers/vfio-pci        # 直通驱动就绪
#   dmesg | grep -i -E 'DMAR-IR|IOMMU enabled'
#   (注: 与 KVM 特性配套, 直通整卡给虚拟机时用 vfio-pci 绑定目标设备)
# ============================================================================

[meta]
desc=VT-d/IOMMU 直通能力预留 (Intel IOMMU + VFIO)
expect_pkgs=kmod-vfio,kmod-vfio-pci

[config]
CONFIG_PACKAGE_kmod-vfio=y
CONFIG_PACKAGE_kmod-vfio-pci=y

[kconfig]
CONFIG_INTEL_IOMMU=y
CONFIG_INTEL_IOMMU_DEFAULT_ON=y
CONFIG_IRQ_REMAP=y
