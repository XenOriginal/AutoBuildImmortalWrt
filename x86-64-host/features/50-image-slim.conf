# ============================================================================
# [可选] 镜像精简 —— 关闭内核调试信息与 BTF
#
# 【实测依据】x86-64-host/imm25.config 里当前是开启状态:
#       CONFIG_KERNEL_DEBUG_INFO=y
#       CONFIG_KERNEL_DEBUG_INFO_BTF=y
#       CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
#   这会显著加大 vmlinux / 内核包体积并拉长编译时间。
#
# 【利】镜像更小、编译更快 (源码编译整体耗时以小时计, 内核是主要部分之一)。
# 【弊】失去 BTF → bpftrace/BCC 类 eBPF 工具不可用; 关闭 DEBUG_INFO 后
#   内核栈回溯只到符号级 (KALLSYMS 仍保留, 崩溃仍可定位到函数)。
#
# 【为什么默认关闭】本固件定位是"NAS/容器宿主 + 软路由", eBPF 观测能力
#   属于可能需要的运维手段; 且在获得一次完整构建耗时基线前, 不该默认砍掉
#   调试能力。确需瘦身时:
#       FEATURES=50-image-slim bash x86-64-host/build-source.sh
#
# 【刷机后核验】ls -l /sys/kernel/btf/vmlinux   # 关闭后该文件不存在
# ============================================================================

[meta]
desc=[可选] 关闭 DEBUG_INFO/BTF 以缩小镜像

[config-unset]
CONFIG_KERNEL_DEBUG_INFO
CONFIG_KERNEL_DEBUG_INFO_BTF
CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES
