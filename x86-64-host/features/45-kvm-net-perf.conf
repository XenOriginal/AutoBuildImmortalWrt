# ============================================================================
# 虚拟化 + 网络栈的编译期能力补全 (KVM 宿主 / 进阶网络)
#
# 【为什么这一项重要：KVM 宿主的内存效率】
#   实测(2026-10-12) 官方基线:
#       # CONFIG_TRANSPARENT_HUGEPAGE is not set
#       # CONFIG_HUGETLBFS is not set
#   即内核里根本没有大页支持 —— 而这台机器要当 KVM 宿主:
#     - 透明大页(THP) 让客户机内存用 2MiB 页映射, 显著减少 TLB miss;
#     - HUGETLBFS 提供显式大页 (/dev/hugepages), QEMU 用 -mem-path 时可
#       预分配、零缺页, 是虚拟机内存性能的常规做法。
#   两者都是"有就用得上、没有就用不了"的能力项, 默认开启无行为副作用
#   (THP 的运行期默认是 madvise: 只有应用主动 madvise(MADV_HUGEPAGE) 才用,
#    QEMU 对客户机内存会这么做)。
#
# 【网络栈: 队列算法能力】
#   基线已有 fq_codel(=y) 与 DEFAULT_FQ_CODEL(=y) —— 生产上正在用, 保持不变。
#   这里补的是"可选算法"的能力:
#     - sch_fq   : BBR 的原配队列 (精确 pacing), 需要时可用
#                  `tc qdisc replace dev X root fq` 或改 default_qdisc 切过去
#     - sch_cake : 缓冲区膨胀治理 (SQM 常用), 1Gbps PPPoE 下 CPU 开销偏高,
#                  故只补能力、不改默认
#   默认行为不变: 仍 fq_codel。
#
# 【为什么不在这里开】
#   - tcp_ecn / default_qdisc / 队列切换属运行期策略, 见 host-files/etc/sysctl.conf
#     与 /etc/hw-tune.conf 的注释项(默认不改, 需要时一行开启)
#   - NIC 硬件 TC 卸载: 本机 WAN 是 PPPoE, 覆盖不到主路径(详见 ab/README.md)
#
# 【刷机后核验】
#   zgrep -E 'TRANSPARENT_HUGEPAGE|HUGETLBFS|NET_SCH_FQ|NET_SCH_CAKE' /proc/config.gz
#   cat /sys/kernel/mm/transparent_hugepage/enabled     # 应为 [madvise]
#   sysctl net.ipv4.tcp_congestion_control net.core.default_qdisc   # bbr / fq_codel
# ============================================================================

[meta]
desc=虚拟化内核调优(THP/HugeTLB) + 网络队列算法能力(sch_fq/sch_cake)

[kconfig]
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y
CONFIG_HUGETLBFS=y
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_CAKE=y

# 【为什么这里不写 kconfig-unset TRANSPARENT_HUGEPAGE_ALWAYS】
#   实测教训(run #20 构建失败): THP 的 sysfs 默认值是一个 choice
#   (ALWAYS/MADVISE/NEVER)。显式把它的【默认成员】ALWAYS 关掉后,
#   目标内核配置里因为同时有 MADVISE=y 仍然自洽; 但工具链内核的配置合并
#   不会保留 MADVISE, 于是 choice 既无默认成员又无选中成员,
#   上游的 `yes '' | make oldconfig` 无法用空行回答 -> kconfig 报错退出。
#   显式设置 MADVISE=y 本身就会让 kconfig 把其余成员置为 not set,
#   因此不需要(也不应该)手写 unset。
