# ============================================================================
# 加密 / 校验加速内核模块
#
# 【实测依据】(ImmortalWrt 25.12 官方内核基线, target/linux/{x86,x86/64,generic})
#   - CONFIG_CRYPTO_AES_NI_INTEL=y       已内建 (x86/64 config 第 90 行) → AES 无需处理
#   - CONFIG_CRYPTO_SHA256_SSSE3 / GHASH_CLMUL / CRC32C_INTEL  均未设置
#   - 现有固件 /lib/modules 里只有 sha1-ssse3.ko / sha512-ssse3.ko / libcrc32c.ko
#
# 【为什么用"包"而不是"内核符号 =y"】
#   OpenWrt 的 package/kernel/linux/modules/crypto.mk 里, x86_64 加速变体本身
#   就是 kmod 包的子变体 (KernelPackage/crypto-sha1/x86_64 声明
#   CONFIG_CRYPTO_SHA1_SSSE3, crypto-sha256/x86_64 声明 CONFIG_CRYPTO_SHA256_SSSE3)。
#   若在 target config 里强写 =y, 这些 .ko 不再生成, 对应 kmod 包会因
#   "missing .ko" 而失败 —— 正是 QAT SDK 那次的失败模式。
#   选包 (而不是强改内核符号) 既拿到加速, 又不与包定义打架。
#
# 【收益场景】IPsec/TLS 的 SHA-256 HMAC、AES-GCM 的 GHASH、NFS/iSCSI 的 CRC32C。
#   当前宿主未跑 WG/IPsec, 属于"为后续加密隧道预留"的底子 (见 FEATURES.md)。
#
# 【刷机后核验】
#   ls /lib/modules/$(uname -r) | grep -E 'sha256|ghash|crc32c|ssse3'
# ============================================================================

[meta]
desc=加密/校验内核模块 (SHA/GHASH/CRC32C 加速)
expect_pkgs=kmod-crypto-sha256,kmod-crypto-ghash,kmod-crypto-crc32c

[config]
CONFIG_PACKAGE_kmod-crypto-sha1=y
CONFIG_PACKAGE_kmod-crypto-sha256=y
CONFIG_PACKAGE_kmod-crypto-ghash=y
CONFIG_PACKAGE_kmod-crypto-crc32c=y
CONFIG_PACKAGE_kmod-lib-crc32c=y
