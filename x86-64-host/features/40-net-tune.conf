# ============================================================================
# [可选] 内核时钟频率 100Hz → 250Hz
#
# 【实测依据】ImmortalWrt 25.12 官方基线 target/linux/generic/config-6.12
#   第 2528 行: CONFIG_HZ_100=y (x86/64 目标继承了它, 故内核 CONFIG_HZ=100)。
#
# 【利】定时器粒度 10ms → 4ms: conntrack 超时回收、qdisc、Docker/容器调度
#   (jellyfin/frigate 等) 的响应更细; 对交互与转发时延有边际收益。
# 【弊】16 线程上每秒定时器中断从 1600 次升到 4000 次, 换来的是更多唤醒与
#   功耗; 而本机瓶颈是容器负载而非 tick 精度, 收益不保证可测。
#
# 【为什么默认关闭】这是"需要实测才有结论"的项, 不该在默认固件里凭空改变
#   已稳定运行的时钟语义。开启方法:
#       FEATURES=40-net-tune bash x86-64-host/build-source.sh
#
# 【必须同时取消 HZ_100】
#   HZ_* 是 Kconfig choice 成员。只写 CONFIG_HZ_250=y 而把 generic 里的
#   CONFIG_HZ_100=y 留着, 合并后会出现同一 choice 两个成员同时置位 ——
#   这正是要显式 [kconfig-unset] 的原因。
#
# 【刷机后核验】zgrep '^CONFIG_HZ' /proc/config.gz   # 期望 CONFIG_HZ=250
# ============================================================================

[meta]
desc=[可选] 内核时钟 100Hz→250Hz (需实测收益)

[kconfig]
CONFIG_HZ_250=y

[kconfig-unset]
CONFIG_HZ_100
