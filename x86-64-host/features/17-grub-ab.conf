# ============================================================================
# A/B 安全自升级所需的 GRUB 环境变量工具
#
# 【为什么需要】
#   单盘 A/B 的"一次性引导 + 失败自动回滚"状态存在 /boot/grub/grubenv
#   (GRUB 的 load_env/save_env 读写它)。系统侧要能创建/读取/修改它,
#   才能:
#       ab-upgrade : 写入 next_entry=<目标槽>, boot_ok=0, bootcount=0
#       ab-bootok  : 启动健康后写入 boot_ok=1
#       ab-status  : 查看当前槽与计数
#   官方 feed 无 grub2-editenv 时, 这台机器上连"看/改引导状态"的手段都没有
#   (实测: 现固件里 grub-editenv 不存在)。
#
# 【配套的构建期改动】
#   ab/patches/0001-grub2-embed-loadenv-saveenv.patch 把 loadenv/saveenv 编进
#   core.img 与 bootx64.efi —— 否则 grubenv 存在也没人能读写。
#   两者缺一不可: 补丁给引导器能力, 本包给系统侧工具。
#
# 【刷机后核验】
#   grub-editenv /boot/grub/grubenv list      # 应能列出 slot 状态变量
#   grub-editenv -h | head -3
# ============================================================================

[meta]
desc=A/B 自升级: GRUB grubenv 工具 (grub2-editenv)
expect_pkgs=grub2-editenv

[config]
CONFIG_PACKAGE_grub2-editenv=y
