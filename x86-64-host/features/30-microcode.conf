# ============================================================================
# Intel CPU 微码更新
#
# 【实测依据】ImmortalWrt 25.12 官方 feed (x86_64) 同时提供 intel-microcode
#   与 iucode-tool 两个包 (apk search 实测存在); 内核侧 CONFIG_MICROCODE=y
#   已在 target/linux/x86/config-6.12 第 254 行内建。
#
# 【为什么值得】Denverton (Atom C3000) 属于长周期嵌入式 SoC, 出厂 BIOS 里的
#   微码往往落后于 Intel 后续发布的勘误修复 (MDS/降频/内存控制器等)。
#   内核早期加载微码是纯收益: 不需要刷 BIOS, 且可用 sysupgrade 回退。
#
# 【刷机后核验】
#   dmesg | grep -i microcode        # 应出现 "microcode: updated to revision ..."
#   grep microcode /proc/cpuinfo     # 当前生效的微码版本
#   (注: 若 BIOS 已是最新微码, 内核会打印 "microcode: sig=..., pf=..., revision=..."
#    但不做更新, 此时无需处理。)
# ============================================================================

[meta]
desc=Intel CPU 微码更新 (Denverton 勘误修复)
expect_pkgs=intel-microcode

[config]
CONFIG_PACKAGE_intel-microcode=y
CONFIG_PACKAGE_iucode-tool=y
