# ============================================================================
# 硬件适配补全: 看门狗 + 温度/SSD 健康巡检
#
# 【为什么这台机器必须有看门狗】
#   实测(2026-10-11): iTCO_wdt.ko 已在固件里, 但 /dev/watchdog 不存在、也没有
#   任何喂狗服务 —— 即"整机挂死只能靠人去断电"。而这台机器历史上出现过
#   D 状态整机挂死(sysctl.conf 里那组脏页回写限制正是为它加的)。
#   生产环境的正确姿势: 硬件看门狗 + 用户态喂狗, 挂死即自动重启。
#
# 【顺序约束(与 A/B 的交互)】
#   ab-bootok 是 START=95, 本服务 START=96: 必须先让系统完成"启动成功标记",
#   否则新槽启动失败会被看门狗反复重启, 掩盖 GRUB 的回滚判定。
#   喂狗器自身还会等 boot_ok=1 才真正 arm (见 hw-watchdog)。
#
# 【实测依据】
#   - kmod-itco-wdt / kmod-hwmon-coretemp / smartmontools 均在 feed 中(实测)
#   - iTCO_vendor_support 已随内核加载; iTCO_wdt 未加载 → /dev/watchdog 缺失
#   - SSD: SAMSUNG MZMTE512HMHP (SATA M.2, TRIM 可用, smartctl 7.5 可读)
#   - 温度: acpitz 26.8°C / coretemp Package 52°C (high 75, crit 95)
#
# 【刷机后核验】
#   ls -l /dev/watchdog && cat /sys/class/watchdog/watchdog0/timeout
#   logread | grep hw-watchdog          # 应看到 "watchdog armed"
#   hw-health                           # 手动跑一次: 温度 + SMART + overlay 使用率
#   smartctl -H /dev/sda                # SSD 健康
# ============================================================================

[meta]
desc=看门狗 + 温度/SSD 健康巡检 (挂死自动重启)
expect_pkgs=kmod-itco-wdt,kmod-hwmon-coretemp,smartmontools

[config]
CONFIG_PACKAGE_kmod-itco-wdt=y
CONFIG_PACKAGE_kmod-hwmon-coretemp=y
CONFIG_PACKAGE_smartmontools=y
CONFIG_PACKAGE_lm-sensors=y
